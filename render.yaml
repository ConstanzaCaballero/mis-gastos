services:
  - type: web
    name: expense-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        sync: false   # Supabase connection string
      - key: SECRET_KEY
        sync: false   # Random secret for Flask sessions
      - key: PASSWORD_ADMIN
        sync: false   # Password for user "admin"
      - key: PASSWORD_MAXIMO
        sync: false   # Password for user "Maximo"
      - key: PASSWORD_GUILLERMO
        sync: false   # Password for user "Guillermo"
