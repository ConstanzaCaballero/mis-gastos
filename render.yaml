services:
  - type: web
    name: expense-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        sync: false   # Supabase connection string
      - key: SECRET_KEY
        sync: false   # Random secret for Flask sessions (e.g. openssl rand -hex 32)
      - key: USERNAME
        sync: false   # Login username
      - key: PASSWORD
        sync: false   # Login password
