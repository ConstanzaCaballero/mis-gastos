services:
  - type: web
    name: expense-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        sync: false   # Supabase connection string
      - key: SECRET_KEY
        sync: false   # Random secret for Flask sessions
      - key: PASSWORD_ADMIN
        sync: false   # Password for user "admin"
      - key: PASSWORD_MAXIMO
        sync: false   # Password for user "Maximo"
      - key: PASSWORD_GUILLERMO
        sync: false   # Password for user "Guillermo"
      - key: TWILIO_ACCOUNT_SID
        sync: false   # Twilio Account SID
      - key: TWILIO_AUTH_TOKEN
        sync: false   # Twilio Auth Token (used to validate webhook signatures)
      - key: WHATSAPP_ADMIN
        sync: false   # WhatsApp phone for admin, e.g. +34612345678
      - key: WHATSAPP_MAXIMO
        sync: false   # WhatsApp phone for Maximo
      - key: WHATSAPP_GUILLERMO
        sync: false   # WhatsApp phone for Guillermo
